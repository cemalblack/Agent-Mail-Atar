<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f0f1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AGENT">
  <title>AGENT</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: #0f0f1a;
      color: #e0e0f0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 12px 14px 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ÜST BAR */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1.5px solid #2a2a4a;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
    }
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #6af7a0;
      box-shadow: 0 0 8px #6af7a0;
    }
    .btn-settings {
      background: #1a1a2e;
      border: 1.5px solid #3a3a6a;
      color: #c0b8ff;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .btn-settings:active { background: #2a2a4a; }

    /* KOMUT BUTONLARI (SEÇİLMEYENLER MAT GRİ, SEÇİLEN RENKLİ) */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .cmd-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 13px;
      border-radius: 12px;
      background: #1a1a2e;
      border: 1.5px solid #2a2a4a;
      color: #7a7a9a;
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 0.4px;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .cmd-btn .cmd-icon {
      font-size: 16px;
      filter: grayscale(100%);
      opacity: 0.55;
      transition: all 0.18s ease;
    }
    .cmd-btn.active {
      color: #ffffff;
      transform: translateY(-1px);
    }
    .cmd-btn.active .cmd-icon {
      filter: grayscale(0%);
      opacity: 1;
    }

    /* AKTİF BUTON RENK TEMALARI */
    .cmd-btn.active.clr-blue {
      background: linear-gradient(135deg, #1e62d0, #2979ff);
      border-color: #82b1ff;
      box-shadow: 0 4px 14px rgba(41, 121, 255, 0.4);
    }
    .cmd-btn.active.clr-green {
      background: linear-gradient(135deg, #00963e, #00c853);
      border-color: #6af7a0;
      box-shadow: 0 4px 14px rgba(0, 200, 83, 0.38);
    }
    .cmd-btn.active.clr-orange {
      background: linear-gradient(135deg, #d84315, #ff9100);
      border-color: #ffd180;
      box-shadow: 0 4px 14px rgba(255, 145, 0, 0.4);
    }
    .cmd-btn.active.clr-purple {
      background: linear-gradient(135deg, #6a1b9a, #aa00ff);
      border-color: #ea80fc;
      box-shadow: 0 4px 14px rgba(170, 0, 255, 0.4);
    }
    .cmd-btn.active.clr-red {
      background: linear-gradient(135deg, #b71c1c, #ff5252);
      border-color: #ff8a80;
      box-shadow: 0 4px 14px rgba(255, 82, 82, 0.4);
    }
    .cmd-btn.active.clr-teal {
      background: linear-gradient(135deg, #006978, #00b8d4);
      border-color: #84ffff;
      box-shadow: 0 4px 14px rgba(0, 184, 212, 0.4);
    }
    .cmd-btn.active.clr-gold {
      background: linear-gradient(135deg, #c66900, #ffb300);
      border-color: #ffe57f;
      box-shadow: 0 4px 14px rgba(255, 179, 0, 0.4);
    }

    /* HIZLI ALT ÇİPLER */
    .chips-wrap {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 8px;
      scrollbar-width: none;
    }
    .chips-wrap::-webkit-scrollbar { display: none; }
    .chip {
      white-space: nowrap;
      background: #1a1a2e;
      border: 1px solid #3a3a6a;
      color: #c0b8ff;
      padding: 6px 11px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .chip:active { background: #2a2a5a; border-color: #7c6af7; color: #fff; }

    /* KONU VE SAĞ ÜST MİKROFON DURUM ROZETİ */
    .top-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .subject-box {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1a1a2e;
      border: 1px solid #3a3a6a;
      border-radius: 8px;
      padding: 6px 10px;
      flex: 1;
    }
    .subject-box span {
      font-size: 12px;
      color: #888;
      font-weight: 700;
    }
    .subject-box input {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 13.5px;
      font-weight: 700;
      width: 100%;
      outline: none;
    }

    @keyframes micPulse {
      0% { box-shadow: 0 0 0 0 rgba(247, 106, 106, 0.6); }
      70% { box-shadow: 0 0 0 9px rgba(247, 106, 106, 0); }
      100% { box-shadow: 0 0 0 0 rgba(247, 106, 106, 0); }
    }
    .mic-badge {
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 12px;
      font-weight: 700;
      white-space: nowrap;
      user-select: none;
    }
    .mic-aktif-badge {
      background: #3a1010;
      border: 1.5px solid #f76a6a;
      color: #f76a6a;
      animation: micPulse 1.5s infinite;
    }
    .mic-donuk-badge {
      background: #1e2a3f;
      border: 1.5px solid #7c6af7;
      color: #c0b8ff;
    }

    /* YAZI KUTUSU */
    .editor-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0f0f1a;
      border: 1.5px solid #3a3a6a;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 8px;
      min-height: 135px;
    }
    .editor-wrap:focus-within {
      border-color: #7c6af7;
    }
    textarea {
      flex: 1;
      width: 100%;
      background: transparent;
      border: none;
      color: #e0e0f0;
      font-size: 15px;
      line-height: 1.5;
      resize: none;
      outline: none;
    }
    .attachments {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }
    .att-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1a1a2e;
      border: 1px solid #3a3a6a;
      padding: 4px 9px;
      border-radius: 7px;
      font-size: 11.5px;
      color: #c0b8ff;
    }
    .att-chip button {
      background: none;
      border: none;
      color: #f76a6a;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    /* YAZI KUTUSU ALTI KONTROL SATIRI (DONDUR/DEVAM ET + TEMİZLE) */
    .voice-action-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .btn-voice-toggle {
      flex: 1.5;
      padding: 11px 10px;
      border-radius: 10px;
      border: 1.5px solid #7c6af7;
      background: #1e2a3f;
      color: #c0b8ff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-voice-toggle.listening {
      background: #f7b96a;
      border-color: #f7b96a;
      color: #0f0f1a;
    }
    .btn-clear {
      flex: 1;
      padding: 11px 10px;
      border-radius: 10px;
      border: 1.5px solid #3a3a6a;
      background: #1a1a2e;
      color: #aaa;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-clear:active { background: #2a2a4a; color: #fff; }

    /* MEDYA EKLEME SATIRI (KAMERA | GALERİ | DOSYA) */
    .media-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .media-btn {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 9px 4px;
      color: #c0b8ff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .media-btn:active { background: #2a2a4a; border-color: #7c6af7; }

    /* ORTALANMIŞ SADE GÖNDER BUTONU */
    .send-wrap {
      display: flex;
      justify-content: center;
      margin-top: auto;
    }
    .btn-send {
      width: 65%;
      padding: 13px 20px;
      border-radius: 24px;
      border: 1.5px solid #2a7a4a;
      background: linear-gradient(135deg, #1b6d3e, #2a9d5c);
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(42, 157, 92, 0.35);
    }
    .btn-send:active { transform: scale(0.98); }
    .btn-send:disabled { opacity: 0.5; cursor: default; }

    /* AYARLAR VE ŞABLON YÖNETİM MODALI */
    .popup-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .popup-overlay.show { display: flex; }
    .popup {
      background: #1a1a2e;
      border: 1px solid #3a3a6a;
      border-radius: 16px;
      padding: 18px;
      width: 100%;
      max-width: 390px;
      max-height: 88dvh;
      overflow-y: auto;
    }
    .popup-title {
      font-size: 15px;
      font-weight: 700;
      color: #c0b8ff;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sec-box {
      background: #0f0f1a;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .sec-title {
      font-size: 12px;
      font-weight: 700;
      color: #7c6af7;
      margin-bottom: 8px;
    }
    .popup input[type="text"], .popup input[type="url"] {
      background: #1a1a2e;
      border: 1px solid #3a3a6a;
      border-radius: 8px;
      color: #e0e0f0;
      padding: 9px 10px;
      font-size: 13px;
      width: 100%;
      outline: none;
      margin-bottom: 8px;
    }
    .popup input:focus { border-color: #7c6af7; }

    /* RENK VE İKON SEÇİCİLER */
    .picker-label { font-size: 11px; color: #888; margin-bottom: 5px; }
    .color-row, .icon-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .clr-swatch {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
    }
    .clr-swatch.selected {
      border-color: #ffffff;
      transform: scale(1.15);
    }
    .ico-swatch {
      background: #1a1a2e;
      border: 1px solid #3a3a6a;
      border-radius: 8px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
    }
    .ico-swatch.selected {
      border-color: #7c6af7;
      background: #2a2a5a;
    }

    /* MEVCUT ŞABLON LİSTESİ */
    .tpl-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 7px 10px;
      margin-bottom: 6px;
      font-size: 12.5px;
    }
    .tpl-del-btn {
      background: #2e0d0d;
      border: 1px solid #7a2a2a;
      color: #f76a6a;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-small {
      width: 100%;
      padding: 9px;
      border-radius: 8px;
      border: none;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-purple { background: #7c6af7; color: #fff; }
    .btn-outline { background: #1a1a2e; border: 1px solid #3a3a6a; color: #aaa; margin-top: 6px; }

    .toast {
      position: fixed;
      top: 56px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e3a1e;
      border: 1.5px solid #2a7a4a;
      color: #6af7a0;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      display: none;
      z-index: 200;
    }
  </style>
</head>
<body>

  <div class="toast" id="toast"></div>

  <!-- ÜST BAR -->
  <div class="header">
    <div class="brand">
      <div class="status-dot"></div>
      <span>AGENT</span>
    </div>
    <button class="btn-settings" onclick="acAyarlar()">⚙️ Ayarlar</button>
  </div>

  <!-- ŞABLON KOMUT BUTONLARI -->
  <div class="grid" id="templateGrid"></div>

  <!-- HIZLI ALT ÇİPLER -->
  <div class="chips-wrap" id="chipsContainer"></div>

  <!-- KONU VE MİKROFON DURUM ROZETİ -->
  <div class="top-info-row">
    <div class="subject-box">
      <span>Konu:</span>
      <input type="text" id="subjectInput" value="Hazırla" oninput="otomatikTaslakKaydet()">
    </div>
    <span id="sesli-durum-badge" class="mic-badge mic-donuk-badge">⏸️ Donduruldu</span>
  </div>

  <!-- METİN VE SES KUTUSU -->
  <div class="editor-wrap">
    <textarea id="bodyInput" placeholder="Dinlemeye Başla tuşuna dokunun veya buraya yazın..." oninput="manuelMetinDegisti()"></textarea>
    <div class="attachments" id="attList"></div>
  </div>

  <!-- DONDUR / DEVAM ET VE TEMİZLE SATIRI -->
  <div class="voice-action-row">
    <button id="sesli-dondur-btn" class="btn-voice-toggle" onclick="dondurSesliNot()">🎤 Dinlemeye Başla</button>
    <button class="btn-clear" onclick="clearAll()">🗑️ Temizle</button>
  </div>

  <!-- MEDYA EKLEME SATIRI -->
  <div class="media-row">
    <button class="media-btn" onclick="document.getElementById('camInput').click()">📷 Kamera</button>
    <button class="media-btn" onclick="document.getElementById('galInput').click()">🖼️ Galeri</button>
    <button class="media-btn" onclick="document.getElementById('fileInput').click()">📎 Dosya Seç</button>
  </div>

  <!-- GİZLİ DOSYA GİRİŞLERİ -->
  <input type="file" id="camInput" accept="image/*" capture="environment" style="display:none" onchange="handleFiles(this.files)">
  <input type="file" id="galInput" accept="image/*" multiple style="display:none" onchange="handleFiles(this.files)">
  <input type="file" id="fileInput" accept="*/*" multiple style="display:none" onchange="handleFiles(this.files)">

  <!-- ORTALANMIŞ SADE GÖNDER BUTONU -->
  <div class="send-wrap">
    <button class="btn-send" id="sendBtn" onclick="sendMail()">GÖNDER</button>
  </div>

  <!-- AYARLAR & ŞABLON YÖNETİM MODALI -->
  <div class="popup-overlay" id="setModal">
    <div class="popup">
      <div class="popup-title">
        <span>⚙️ Ayarlar ve Şablonlar</span>
        <button onclick="kapatAyarlar()" style="background:none;border:none;color:#888;font-size:18px;cursor:pointer;">✕</button>
      </div>

      <!-- 1. APPS SCRIPT URL -->
      <div class="sec-box">
        <div class="sec-title">🔗 Google Apps Script Bağlantısı</div>
        <input type="url" id="webhookInput" placeholder="https://script.google.com/macros/s/.../exec">
        <button class="btn-small btn-purple" onclick="saveWebhook()">Bağlantıyı Kaydet</button>
      </div>

      <!-- 2. YENİ ŞABLON EKLE -->
      <div class="sec-box">
        <div class="sec-title">➕ Yeni Komut Butonu Ekle</div>
        <input type="text" id="newTplName" placeholder="Buton Adı (Örn: VERGİ)">
        <input type="text" id="newTplSubj" placeholder="Mail Konusu (Örn: Vergi)">
        <input type="text" id="newTplChips" placeholder="Alt Çipler (Virgülle ayırın)">

        <div class="picker-label">Buton Rengi Seçin (Seçildiğinde Parlar):</div>
        <div class="color-row" id="colorPickerRow"></div>

        <div class="picker-label">İkon Seçin:</div>
        <div class="icon-row" id="iconPickerRow"></div>

        <button class="btn-small btn-purple" onclick="addTemplate()">Şablonu Ekle</button>
      </div>

      <!-- 3. MEVCUT BUTONLARI YÖNET / SİL -->
      <div class="sec-box">
        <div class="sec-title">📂 Mevcut Butonlar (Sil / Sıfırla)</div>
        <div id="settingsTplList"></div>
        <button class="btn-small btn-outline" onclick="restoreDefaultTemplates()">🔄 Varsayılan 4 Butonu Geri Yükle</button>
      </div>
    </div>
  </div>

  <script>
    const VARSAYILAN_SABLONLAR = [
      { id: 'hazirla', label: 'HAZIRLA', icon: '📝', subject: 'Hazırla', cls: 'clr-blue', chips: ['ONS Altın Raporu Hazırla', 'BİST30 Raporu Hazırla', 'Genel Piyasa Raporu Hazırla'] },
      { id: 'pozisyon', label: 'POZİSYON', icon: '📈', subject: 'Pozisyon', cls: 'clr-green', chips: ['Long Poz Açıldı', 'Short Poz Kapatıldı', 'Ek Alım Yapıldı', 'Stop Güncellendi'] },
      { id: 'hukuk', label: 'HUKUK', icon: '⚖️', subject: 'Hukuk', cls: 'clr-orange', chips: ['Mevzuat Araştırması Yap', 'Dilekçe Taslağı Hazırla', 'Ekli Belgeyi İncele'] },
      { id: 'haberler', label: 'HABERLER', icon: '📰', subject: 'Haberler', cls: 'clr-purple', chips: ['Flaş Haber Özeti Çıkar', 'Şok Kırılım Analizi', 'Ekli Grafiği Yorumla'] }
    ];

    const RENK_SECENEKLERI = [
      { cls: 'clr-blue', hex: '#2979ff' },
      { cls: 'clr-green', hex: '#00c853' },
      { cls: 'clr-orange', hex: '#ff9100' },
      { cls: 'clr-purple', hex: '#aa00ff' },
      { cls: 'clr-red', hex: '#ff5252' },
      { cls: 'clr-teal', hex: '#00b8d4' },
      { cls: 'clr-gold', hex: '#ffb300' }
    ];

    const IKON_SECENEKLERI = ['📝', '📈', '⚖️', '📰', '💰', '🏦', '⚡', '🎯', '🛡️', '📊'];

    let templates = [];
    let activeId = 'hazirla';
    let selectedColor = 'clr-blue';
    let selectedIcon = '⚡';
    let attachments = [];

    function loadTemplates() {
      const saved = localStorage.getItem('agent_all_templates');
      if (saved) {
        try { templates = JSON.parse(saved); } catch (e) { templates = []; }
      }
      if (!templates || templates.length === 0) {
        templates = JSON.parse(JSON.stringify(VARSAYILAN_SABLONLAR));
        saveTemplates();
      }
    }

    function saveTemplates() {
      localStorage.setItem('agent_all_templates', JSON.stringify(templates));
    }

    function renderTemplates() {
      const grid = document.getElementById('templateGrid');
      grid.innerHTML = '';

      if (!templates.find(t => t.id === activeId) && templates.length > 0) {
        activeId = templates[0].id;
      }

      templates.forEach(t => {
        const isAct = t.id === activeId;
        const btn = document.createElement('button');
        btn.className = `cmd-btn ${t.cls || 'clr-blue'} ${isAct ? 'active' : ''}`;
        btn.innerHTML = `<span>${t.label}</span><span class="cmd-icon">${t.icon || '⚡'}</span>`;
        btn.onclick = () => selectTemplate(t);
        grid.appendChild(btn);
      });

      const current = templates.find(x => x.id === activeId);
      renderChips(current ? (current.chips || []) : []);
    }

    function selectTemplate(t) {
      activeId = t.id;
      document.getElementById('subjectInput').value = t.subject;
      renderTemplates();
      otomatikTaslakKaydet();
    }

    function renderChips(chips) {
      const box = document.getElementById('chipsContainer');
      box.innerHTML = '';
      chips.forEach(c => {
        const el = document.createElement('button');
        el.className = 'chip';
        el.textContent = c;
        el.onclick = () => {
          const area = document.getElementById('bodyInput');
          area.value = area.value ? area.value.trim() + '\n' + c + ' ' : c + ' ';
          oncekiOturumMetni = area.value.trim();
          otomatikTaslakKaydet();
        };
        box.appendChild(el);
      });
    }

    // ===== BÜTÇE UYGULAMASINDAKİ TEKRARSIZ SES MOTORU =====
    var sesTanima = null;
    var sesDinlemeAktif = false;
    var sesDonukMu = true; // İlk açılışta sessiz (Dondurulmuş) başlar
    var oncekiOturumMetni = '';

    function manuelMetinDegisti() {
      var kutu = document.getElementById('bodyInput');
      if (kutu) oncekiOturumMetni = kutu.value.trim();
      otomatikTaslakKaydet();
    }

    function guncelleSesliDurumUI(dinliyor) {
      var bdg = document.getElementById('sesli-durum-badge');
      var dBtn = document.getElementById('sesli-dondur-btn');
      if (!bdg || !dBtn) return;
      if (dinliyor) {
        bdg.className = 'mic-badge mic-aktif-badge';
        bdg.textContent = '🔴 Dinleniyor...';
        dBtn.className = 'btn-voice-toggle listening';
        dBtn.textContent = '⏸️ Tamam (Dondur)';
      } else {
        bdg.className = 'mic-badge mic-donuk-badge';
        bdg.textContent = '⏸️ Donduruldu';
        dBtn.className = 'btn-voice-toggle';
        dBtn.textContent = '🎤 Dinlemeye Devam Et';
      }
    }

    function baslatSesliDinleme() {
      var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        showToast('Tarayıcınız sesli yazdırmayı desteklemiyor.');
        return;
      }
      if (sesTanima) {
        try { sesTanima.onend = null; sesTanima.stop(); } catch (e) {}
      }
      sesTanima = new SpeechRec();
      sesTanima.lang = 'tr-TR';
      sesTanima.continuous = true;
      sesTanima.interimResults = true;
      sesDinlemeAktif = true;

      sesTanima.onresult = function(event) {
        if (sesDonukMu) return;
        var oturumKesin = '';
        var oturumAra = '';
        for (var i = 0; i < event.results.length; ++i) {
          var parca = event.results[i][0].transcript.trim();
          if (event.results[i].isFinal) {
            if (oturumKesin && parca.toLowerCase().indexOf(oturumKesin.trim().toLowerCase()) === 0) {
              oturumKesin = parca + ' ';
            } else {
              oturumKesin += parca + ' ';
            }
          } else {
            oturumAra = parca;
          }
        }
        var birlesik = (oncekiOturumMetni ? oncekiOturumMetni + ' ' : '') + oturumKesin + oturumAra;
        var kutu = document.getElementById('bodyInput');
        if (kutu) {
          kutu.value = birlesik.trimStart();
          kutu.scrollTop = kutu.scrollHeight;
          otomatikTaslakKaydet();
        }
      };

      sesTanima.onerror = function(ev) {
        if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
          durdurMikrofonKesin();
          showToast('Mikrofon izni verilmedi.');
        }
      };

      sesTanima.onend = function() {
        if (sesDinlemeAktif && !sesDonukMu) {
          var kutu = document.getElementById('bodyInput');
          if (kutu) oncekiOturumMetni = kutu.value.trim();
          try { sesTanima.start(); } catch (e) {}
        }
      };

      try { sesTanima.start(); } catch (e) {}
    }

    function dondurSesliNot() {
      var kutu = document.getElementById('bodyInput');
      if (!sesDonukMu) {
        durdurMikrofonKesin();
      } else {
        sesDonukMu = false;
        if (kutu) oncekiOturumMetni = kutu.value.trim();
        guncelleSesliDurumUI(true);
        baslatSesliDinleme();
      }
    }

    function durdurMikrofonKesin() {
      var kutu = document.getElementById('bodyInput');
      sesDonukMu = true;
      sesDinlemeAktif = false;
      if (sesTanima) {
        try { sesTanima.onend = null; sesTanima.stop(); } catch (e) {}
      }
      if (kutu) oncekiOturumMetni = kutu.value.trim();
      guncelleSesliDurumUI(false);
    }

    // ===== OTOMATİK TASLAK VE TEMİZLEME =====
    function otomatikTaslakKaydet() {
      const draft = {
        activeId,
        subject: document.getElementById('subjectInput').value,
        body: document.getElementById('bodyInput').value
      };
      localStorage.setItem('agent_draft', JSON.stringify(draft));
    }

    function clearAll() {
      durdurMikrofonKesin();
      document.getElementById('bodyInput').value = '';
      oncekiOturumMetni = '';
      attachments = [];
      renderAttachments();
      localStorage.removeItem('agent_draft');
      document.getElementById('sesli-dondur-btn').textContent = '🎤 Dinlemeye Başla';
      showToast('Ekran temizlendi.');
    }

    // ===== DOSYA VE KAMERA EKLEME =====
    function handleFiles(fileList) {
      Array.from(fileList).forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const base64 = e.target.result.split(',')[1];
          attachments.push({ name: file.name, mimeType: file.type || 'application/octet-stream', data: base64 });
          renderAttachments();
        };
        reader.readAsDataURL(file);
      });
    }

    function renderAttachments() {
      const list = document.getElementById('attList');
      list.innerHTML = '';
      attachments.forEach((att, idx) => {
        const chip = document.createElement('div');
        chip.className = 'att-chip';
        chip.innerHTML = `<span>📎 ${att.name.slice(0, 22)}</span><button onclick="removeAtt(${idx})">✕</button>`;
        list.appendChild(chip);
      });
    }

    function removeAtt(idx) {
      attachments.splice(idx, 1);
      renderAttachments();
    }

    // ===== MAİL GÖNDERİMİ =====
    async function sendMail() {
      durdurMikrofonKesin();
      const subject = document.getElementById('subjectInput').value.trim();
      const body = document.getElementById('bodyInput').value.trim();
      const webhook = localStorage.getItem('agent_webhook_url') || '';

      if (!subject && !body && attachments.length === 0) {
        return showToast('Gönderilecek içerik boş.');
      }

      if (!webhook) {
        window.location.href = `mailto:cemalblack@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        return;
      }

      const sendBtn = document.getElementById('sendBtn');
      sendBtn.textContent = 'GÖNDERİLİYOR...';
      sendBtn.disabled = true;

      try {
        await fetch(webhook, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ subject, body, attachments })
        });
        clearAll();
        showToast('✅ Komut başarıyla gönderildi!');
      } catch (err) {
        showToast('Gönderim hatası oluştu.');
      } finally {
        sendBtn.textContent = 'GÖNDER';
        sendBtn.disabled = false;
      }
    }

    // ===== AYARLAR VE ŞABLON YÖNETİMİ =====
    function acAyarlar() {
      document.getElementById('webhookInput').value = localStorage.getItem('agent_webhook_url') || '';
      renderPickers();
      renderSettingsTplList();
      document.getElementById('setModal').classList.add('show');
    }

    function kapatAyarlar() {
      document.getElementById('setModal').classList.remove('show');
    }

    function saveWebhook() {
      const url = document.getElementById('webhookInput').value.trim();
      localStorage.setItem('agent_webhook_url', url);
      showToast('✓ Bağlantı kaydedildi.');
    }

    function renderPickers() {
      const cRow = document.getElementById('colorPickerRow');
      cRow.innerHTML = '';
      RENK_SECENEKLERI.forEach(c => {
        const sw = document.createElement('div');
        sw.className = `clr-swatch ${c.cls === selectedColor ? 'selected' : ''}`;
        sw.style.background = c.hex;
        sw.onclick = () => { selectedColor = c.cls; renderPickers(); };
        cRow.appendChild(sw);
      });

      const iRow = document.getElementById('iconPickerRow');
      iRow.innerHTML = '';
      IKON_SECENEKLERI.forEach(ic => {
        const sw = document.createElement('div');
        sw.className = `ico-swatch ${ic === selectedIcon ? 'selected' : ''}`;
        sw.textContent = ic;
        sw.onclick = () => { selectedIcon = ic; renderPickers(); };
        iRow.appendChild(sw);
      });
    }

    function renderSettingsTplList() {
      const container = document.getElementById('settingsTplList');
      container.innerHTML = '';
      templates.forEach(t => {
        const row = document.createElement('div');
        row.className = 'tpl-list-item';
        row.innerHTML = `<span>${t.icon || '⚡'} <b>${t.label}</b> <span style="color:#888;font-size:11px;">(${t.subject})</span></span>`;
        const delBtn = document.createElement('button');
        delBtn.className = 'tpl-del-btn';
        delBtn.textContent = 'Sil';
        delBtn.onclick = () => deleteTemplate(t.id);
        row.appendChild(delBtn);
        container.appendChild(row);
      });
    }

    function addTemplate() {
      const name = document.getElementById('newTplName').value.trim().toUpperCase();
      const subj = document.getElementById('newTplSubj').value.trim();
      const chipsRaw = document.getElementById('newTplChips').value;
      if (!name || !subj) return showToast('Buton adı ve konu zorunludur.');

      const chips = chipsRaw ? chipsRaw.split(',').map(s => s.trim()).filter(Boolean) : [];
      templates.push({
        id: 'tpl_' + Date.now(),
        label: name,
        icon: selectedIcon,
        subject: subj,
        cls: selectedColor,
        chips
      });
      saveTemplates();
      document.getElementById('newTplName').value = '';
      document.getElementById('newTplSubj').value = '';
      document.getElementById('newTplChips').value = '';
      renderSettingsTplList();
      renderTemplates();
      showToast('✓ Yeni buton eklendi.');
    }

    function deleteTemplate(id) {
      if (templates.length <= 1) return showToast('En az 1 buton kalmalıdır.');
      templates = templates.filter(t => t.id !== id);
      saveTemplates();
      renderSettingsTplList();
      renderTemplates();
    }

    function restoreDefaultTemplates() {
      templates = JSON.parse(JSON.stringify(VARSAYILAN_SABLONLAR));
      activeId = 'hazirla';
      saveTemplates();
      renderSettingsTplList();
      renderTemplates();
      showToast('✓ Varsayılan butonlar yüklendi.');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2400);
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadTemplates();
      const saved = JSON.parse(localStorage.getItem('agent_draft') || 'null');
      if (saved) {
        activeId = saved.activeId || templates[0].id;
        document.getElementById('subjectInput').value = saved.subject || 'Hazırla';
        document.getElementById('bodyInput').value = saved.body || '';
        oncekiOturumMetni = saved.body || '';
      }
      renderTemplates();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    });
  </script>
</body>
